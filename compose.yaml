services:
  app:
    build: .
    container_name: meeting_scheduler_app
    ports:
      - "8080:8080"
    environment:
      - JDBC_DATABASE_URL=jdbc:postgresql://postgres:5432/scheduler
      - DB_USER=admin
      - DB_PASSWORD=password
      - INTERNAL_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: postgres:15-alpine
    container_name: scheduler_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: