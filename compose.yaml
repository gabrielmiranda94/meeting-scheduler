version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scheduler_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: